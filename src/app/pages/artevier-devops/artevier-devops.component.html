<nav
  class="fixed top-0 left-0 w-full z-[60] backdrop-blur bg-white/50 dark:bg-slate-900/40"
>
  <app-navbar></app-navbar>
</nav>

<div class="pt-20 min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors">
  <div class="max-w-[1400px] mx-auto px-6 py-6">
    <div class="flex items-center justify-between mb-4">
      <!-- Back button -->
      <button
        type="button"
        (click)="goBack()"
        class="back-btn inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold border border-slate-300 text-slate-700 dark:text-slate-200 dark:border-slate-600 transition"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 111.414 1.414L7.414 9H16a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z"
            clip-rule="evenodd"
          />
        </svg>
        Back
      </button>

      <!-- Theme swap -->
      <button
        type="button"
        (click)="toggleTheme()"
        class="theme-toggle inline-flex items-center justify-center h-9 w-9 rounded-full border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-200 transition"
        [attr.aria-label]="
          darkMode ? 'Switch to light mode' : 'Switch to dark mode'
        "
      >
        <svg
          *ngIf="!darkMode"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-1.657-5.657a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 10a1 1 0 011 1h0a1 1 0 01-1 1h-1a1 1 0 110-2h1zM4 10a1 1 0 011 1H3a1 1 0 110-2h1a1 1 0 010 1zm10.657 5.657a1 1 0 01-1.414 0l-.707-.707a1 1 0 111.414-1.414l.707.707a1 1 0 010 1.414zM6.464 6.464a1 1 0 01-1.414 0l-.707-.707A1 1 0 115.757 4.343l.707.707a1 1 0 010 1.414zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.95-1.05a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0z"
          />
        </svg>
        <svg
          *ngIf="darkMode"
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
          />
        </svg>
      </button>
    </div>

    <!-- Section tabs (under-navbar sub nav) -->
    <div
      class="section-tabs flex gap-1 overflow-x-auto mb-4 border-b border-slate-200 dark:border-slate-700"
    >
      <button
        *ngFor="let s of sections"
        type="button"
        (click)="setActive(s.key)"
        class="tab-item whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold transition"
        [class.tab-item--active]="active === s.key"
      >
        {{ s.label }}
      </button>
    </div>

    <!-- Article content -->
    <div class="max-w-3xl mx-auto">
      <div class="text-center mb-4">
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">
          {{ activeSection.pageTitle }}
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Mohamed Ali Romdhani · Artevier DevOps Series
          <span *ngIf="activeSection.articleReadTime">
            · {{ activeSection.articleReadTime }}</span
          >
        </p>
      </div>

      <!-- Empty section placeholder -->
      <div
        *ngIf="!activeSection.articleBlocks.length"
        class="step-card rounded-2xl bg-white dark:bg-slate-800 p-8"
      >
        <p class="text-sm text-slate-400 text-center">Content coming soon.</p>
      </div>

      <!-- STEP VIEW (one block at a time) -->
      <div
        *ngIf="activeSection.articleBlocks.length && !articleViewAll"
        class="step-card rounded-2xl bg-white dark:bg-slate-800 p-8"
      >
        <ng-container *ngIf="currentArticleBlock as block">
          <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-3">
            {{ block.heading }}
          </h2>
          <p
            *ngFor="let p of block.paragraphs"
            class="text-sm leading-relaxed text-slate-600 dark:text-slate-300 mb-3"
            [innerHTML]="formatBullet(p)"
          ></p>

          <figure *ngIf="block.image" class="mt-4 mb-2">
            <img
              [src]="block.image"
              [alt]="block.heading"
              class="w-full rounded-xl border border-slate-200"
            />
            <figcaption
              *ngIf="block.imageCaption"
              class="text-xs text-slate-400 mt-2 text-center"
            >
              {{ block.imageCaption }}
            </figcaption>
          </figure>
          <figure *ngIf="block.video" class="mt-4 mb-2">
            <video
              [src]="block.video"
              [attr.key]="block.video"
              controls
              preload="metadata"
              class="w-full rounded-xl border border-slate-200 shadow-sm"
            ></video>

            <figcaption
              *ngIf="block.imageCaption"
              class="text-xs text-slate-400 mt-2 text-center"
            >
              {{ block.imageCaption }}
            </figcaption>
          </figure>

          <!-- macOS Terminal Code Block -->
          <div *ngIf="block.codeBlock" class="code-block-wrapper">
            <div class="code-block-header">
              <span class="mac-dot close"></span>
              <span class="mac-dot minimize"></span>
              <span class="mac-dot maximize"></span>
            </div>
            <pre
              class="code-block-body"
            ><code>{{ block.codeBlock }}</code></pre>
          </div>
        </ng-container>

        <!-- Footer: step dots + view all + next -->
        <div
          class="step-footer flex items-center justify-between gap-4 pt-6 mt-6 border-t border-slate-100 dark:border-slate-700"
        >
          <div class="flex items-center gap-3">
            <button
              type="button"
              (click)="prevArticleStep()"
              [disabled]="articleStepIndex === 0"
              class="step-back inline-flex items-center justify-center h-7 w-7 rounded-full border border-slate-200 text-slate-500 disabled:opacity-30 transition"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-3.5 w-3.5"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>

            <div class="flex items-center gap-1.5">
              <button
                *ngFor="let block of activeSection.articleBlocks; let i = index"
                type="button"
                (click)="setArticleStep(i)"
                class="step-dot h-6 w-6 rounded-full text-[11px] font-semibold flex items-center justify-center transition"
                [class.step-dot--active]="i === articleStepIndex"
              >
                {{ i + 1 }}
              </button>
            </div>

            <button
              type="button"
              (click)="toggleViewAll()"
              class="step-view-all text-xs font-semibold text-slate-500 ml-2"
            >
              View all steps
            </button>
          </div>

          <button
            type="button"
            (click)="nextArticleStep()"
            *ngIf="
              articleStepIndex < (activeSection.articleBlocks.length || 0) - 1
            "
            class="step-next inline-flex items-center rounded-full px-5 py-2 text-sm font-semibold text-white transition"
          >
            Next
          </button>
        </div>
      </div>

      <!-- VIEW ALL (full article, all blocks stacked) -->
      <div
        *ngIf="activeSection.articleBlocks.length && articleViewAll"
        class="step-card rounded-2xl bg-white dark:bg-slate-800 p-8"
      >
        <button
          type="button"
          (click)="toggleViewAll()"
          class="step-view-all text-xs font-semibold text-slate-500 mb-6 inline-flex items-center gap-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-3 w-3"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
              clip-rule="evenodd"
            />
          </svg>
          Back to step view
        </button>

        <section
          *ngFor="let block of activeSection.articleBlocks; let i = index"
          class="article-block mb-8"
        >
          <h2
            class="article-heading text-lg font-bold text-slate-900 dark:text-white mb-3"
          >
            {{ i + 1 }}. {{ block.heading }}
          </h2>
          <p
            *ngFor="let p of block.paragraphs"
            class="text-sm leading-relaxed text-slate-600 dark:text-slate-300 mb-3"
            [innerHTML]="formatBullet(p)"
          ></p>

          <figure *ngIf="block.image" class="mt-4 mb-2">
            <img
              [src]="block.image"
              [alt]="block.heading"
              class="w-full rounded-xl border border-slate-200"
            />
            <figcaption
              *ngIf="block.imageCaption"
              class="text-xs text-slate-400 mt-2 text-center"
            >
              {{ block.imageCaption }}
            </figcaption>
          </figure>

          <figure *ngIf="block.video" class="mt-4 mb-2">
            <video
              [src]="block.video"
              [attr.key]="block.video"
              controls
              preload="metadata"
              class="w-full rounded-xl border border-slate-200 shadow-sm"
            ></video>

            <figcaption
              *ngIf="block.imageCaption"
              class="text-xs text-slate-400 mt-2 text-center"
            >
              {{ block.imageCaption }}
            </figcaption>
          </figure>

          <!-- macOS Terminal Code Block -->
          <div *ngIf="block.codeBlock" class="code-block-wrapper">
            <div class="code-block-header">
              <span class="mac-dot close"></span>
              <span class="mac-dot minimize"></span>
              <span class="mac-dot maximize"></span>
            </div>
            <pre
              class="code-block-body"
            ><code>{{ block.codeBlock }}</code></pre>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
